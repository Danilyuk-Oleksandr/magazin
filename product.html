<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | CyberTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-enter">
    <div class="cursor-glow"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">CyberTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Product Page -->
    <section class="product-page">
        <div class="container">
            <div class="section-shell">
                <div class="breadcrumbs">
                    <a href="index.html">Home</a>
                    <span>/</span>
                    <a href="index.html">Products</a>
                    <span>/</span>
                    <span id="breadcrumbTitle">Product</span>
                </div>
                <div class="product-layout">
                    <div class="product-gallery">
                        <div class="main-image-wrapper">
                            <img src="" alt="Product" id="mainProductImage" class="main-product-image">
                        </div>
                        <div class="thumbnail-list" id="thumbnailList"></div>
                    </div>
                    <div class="product-info">
                        <span class="product-page-category" id="productCategory"></span>
                        <h1 class="product-page-title" id="productTitle"></h1>
                        <div class="product-page-price" id="productPrice"></div>
                        <p class="product-page-description" id="productDescription"></p>
                        <div class="product-page-actions">
                            <div class="quantity-selector">
                                <button class="qty-btn" id="decreaseQty">−</button>
                                <span id="quantityValue">1</span>
                                <button class="qty-btn" id="increaseQty">+</button>
                            </div>
                            <div class="product-cart-actions">
                                <button class="hero-btn" id="addToCartBtn">Add To Cart</button>
                                <div class="product-cart-preview" id="productCartPreview">
                                    <span>Cart:</span>
                                    <strong id="productCartCount">0 items</strong>
                                </div>
                            </div>
                        </div>
                        <div class="product-specs">
                            <h3>Specifications</h3>
                            <ul id="specificationsList"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section>
        <div class="container">
            <div class="section-shell">
                <h2 class="section-title">Related Products</h2>
                <div class="products-grid" id="relatedProducts"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <h3 class="footer-logo">CyberTech</h3>
                    <p>Premium gaming ecommerce experience.</p>
                </div>
                <div>
                    <h4>Navigation</h4>
                    <ul>
                        <li>Home</li>
                        <li>Products</li>
                        <li>About</li>
                    </ul>
                </div>
                <div>
                    <h4>Socials</h4>
                    <ul>
                        <li>Instagram</li>
                        <li>Discord</li>
                        <li>Twitter</li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <button class="scroll-top">

        ↑

    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/product.js"></script>
</body>

</html>
